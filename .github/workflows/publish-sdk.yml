name: Publish SDK to GitHub Packages

# Publishes packages/sdk-typescript as @aspensprotocol/sdk-ts to the GitHub
# Packages npm registry. Release by bumping "version" in
# packages/sdk-typescript/package.json, merging, then pushing a matching tag:
#
#   git tag sdk-v0.2.0 && git push origin sdk-v0.2.0

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-typescript

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # npm does the publish: it reads NODE_AUTH_TOKEN through the .npmrc
      # that setup-node writes for the @aspensprotocol scope.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@aspensprotocol"

      # A tag that disagrees with package.json would publish a version nobody
      # asked for, so refuse it rather than trusting either one.
      - name: Tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#sdk-v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag sdk-v$TAG does not match package.json version $PKG"; exit 1; }

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: rm -rf dist && bun run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
