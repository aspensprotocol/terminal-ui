name: Publish SDK to npmjs

# Publishes packages/sdk-typescript as @aspensprotocol/sdk-ts to npmjs, public,
# with provenance. Release by bumping "version" in
# packages/sdk-typescript/package.json, merging, then pushing a matching tag:
#
#   git tag sdk-v0.4.1 && git push origin sdk-v0.4.1
#
# Authentication: npm trusted publishing (OIDC, this workflow file) once it is
# configured on the package; until then the NPM_TOKEN repository secret, a
# granular token with write access to the @aspensprotocol scope.

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  # OIDC: trusted publishing and the provenance attestation.
  id-token: write

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-typescript

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # npm does the publish: it reads NODE_AUTH_TOKEN through the .npmrc
      # that setup-node writes for the @aspensprotocol scope.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@aspensprotocol"

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: npm with trusted publishing
        run: npm install -g npm@11.6.2

      # A tag that disagrees with package.json would publish a version nobody
      # asked for, so refuse it rather than trusting either one.
      - name: Tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#sdk-v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag sdk-v$TAG does not match package.json version $PKG"; exit 1; }

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: rm -rf dist && bun run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
